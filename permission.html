<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1F33" />
    <title>ViAble microphone access</title>
    <style>
      :root { color: #0b1f33; background: #f7fafc; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; }
      main { width: min(440px, calc(100% - 40px)); padding: 34px; background: #fff; border: 1px solid #dfe8ee; border-radius: 18px; box-shadow: 0 16px 40px rgba(11,31,51,.08); text-align: center; }
      img { width: 112px; height: 112px; object-fit: contain; }
      h1 { margin: 16px 0 8px; font-size: 25px; letter-spacing: -.04em; }
      p { color: #687c8b; font-size: 14px; }
      button { min-height: 46px; padding: 0 20px; border: 0; border-radius: 10px; color: #fff; background: #087f70; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 24px; margin-bottom: 0; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo.png" alt="ViAble" />
      <h1>Allow microphone access</h1>
      <p>ViAble needs your microphone for voice requests. Choose Allow in the browser prompt; this tab will close and the side panel will start listening.</p>
      <button id="allow-microphone" type="button">Allow microphone</button>
      <p id="status" role="status" aria-live="polite">Waiting for permission…</p>
    </main>
    <script type="module" src="/src/permission.ts"></script>
  </body>
</html>
